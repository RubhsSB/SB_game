<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <title>Bachata Trainer</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#0a0808">
</head>

<body>

    <!-- =========================
         CABECERA
    ========================== -->
    <div class="header-container">

        <!-- Resultados -->
        <div id="results-button">
            <button
                onclick="window.location.href='resultados.html'"
                aria-label="Ver resultados"
            >
                ⌛
            </button>
        </div>


        <!-- Gestor de figuras -->
        <div id="manager-button">
            <button
                id="open-manager-btn"
                aria-label="Gestionar figuras"
            >
                ⚙️
            </button>
        </div>


        <!-- Modos de juego -->
        <div id="level-selection">

            <button
                id="easy"
                class="active"
                aria-label="Modo Easy"
            >
                E
            </button>

            <button
                id="hard"
                aria-label="Modo Hard"
            >
                H
            </button>

            <button
                id="family"
                aria-label="Modo Familia"
            >
                F
            </button>

            <button
                id="timer-mode"
                aria-label="Modo Timer"
            >
                T
            </button>

        </div>

    </div>


    <!-- =========================
         TARJETA PRINCIPAL
    ========================== -->
    <main class="game-container">

        <div class="card">

            <!-- Selector de familia -->
            <div
                id="family-selector-container"
                style="display: none;"
            >
                <select id="family-selector"></select>
            </div>


            <!-- =========================
                 FIGURA
            ========================== -->
            <div id="word">

                <span class="main-text">
                    Presiona Play para comenzar
                </span>

            </div>


            <!-- =========================
                 PROGRESO
                 Se utilizará principalmente
                 en el modo EASY
            ========================== -->
            <div
                id="progress-container"
                class="progress-container"
            >

                <div class="progress-info">

                    <span class="progress-label">
                        Progreso
                    </span>

                    <span id="progress-text">
                        0 / 0
                    </span>

                </div>


                <div class="progress-bar">

                    <div id="progress-fill"></div>

                </div>

            </div>


            <!-- =========================
                 INFORMACIÓN
            ========================== -->
            <div class="info-row">

                <!-- Contador -->
                <div class="counter-box">

                    <span class="info-label">
                        PALABRAS
                    </span>

                    <span id="counter">
                        0
                    </span>

                </div>


                <!-- Cronómetro -->
                <div
                    id="timer"
                    class="timer-pill"
                >
                    ⏱ 0.0 s
                </div>

            </div>


            <!-- =========================
                 BOTONES DE JUEGO
            ========================== -->
            <div class="button-row">

                <button
                    id="play"
                    class="main-action"
                >
                    ▶ PLAY
                </button>


                <button
                    id="next"
                    class="main-action"
                    style="display: none;"
                >
                    SIGUIENTE
                </button>


                <button
                    id="finish"
                    class="finish-action"
                    style="display: none;"
                >
                    Finalizar
                </button>

            </div>


            <!-- Resultado -->
            <div id="result"></div>

        </div>

    </main>


    <!-- =========================
         GESTOR DE FIGURAS
    ========================== -->
    <div
        id="manager-modal"
        class="modal"
        style="display: none;"
    >

        <div class="modal-content">

            <span
                id="close-manager-btn"
                class="close-btn"
            >
                &times;
            </span>


            <h2>
                Gestor de Figuras
            </h2>


            <div class="add-word-section">

                <input
                    type="text"
                    id="new-word-input"
                    placeholder="Ej: JHERSY (Nueva figura)"
                >

                <button id="add-word-btn">
                    Añadir
                </button>

            </div>


            <h3>
                Mis Figuras Personalizadas
            </h3>


            <ul id="custom-words-list">
                <!-- Las figuras personalizadas aparecerán aquí -->
            </ul>


            <p class="manager-help">
                La base de figuras original carga sola y no se puede
                borrar desde aquí. Si actualizas la lista en GitHub,
                los cambios aparecerán automáticamente.
            </p>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->
    <script src="script.js"></script>


    <!-- =========================
         SERVICE WORKER
    ========================== -->
    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener("load", () => {

                navigator.serviceWorker
                    .register("sw.js")

                    .then(() => {
                        console.log("SW registrado");
                    })

                    .catch(error => {
                        console.log(
                            "Error SW",
                            error
                        );
                    });

            });

        }

    </script>

</body>

</html>
